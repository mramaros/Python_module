[project]
name = "mazegen"
version = "0.1.0"
description = "A_maze_ing"
authors = [
    {name = "mramaros raaron-v"}
]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=1.19.1)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[[tool.mypy.overrides]]
module = "mlx.*"
ignore_missing_imports = true
